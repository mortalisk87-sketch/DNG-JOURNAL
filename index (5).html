<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Luisville Journal – DNG</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:wght@400;700;900&family=Old+Standard+TT:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--paper:#efe4c8;--ink:#1d1a14;--soft:#6b5f45;--rule:#1d1a14;--card:#f6edd5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#d9cba6;--card:#e4d7b4}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#3b4a63 url(background.jpg) center/cover fixed no-repeat;color:var(--ink);font-family:'Old Standard TT',Georgia,serif;font-size:17px;line-height:1.55}
.sheet{max-width:960px;margin:28px auto;background:var(--paper);min-height:100vh;padding:18px 28px 28px;box-shadow:0 0 40px rgba(0,0,0,.4);background-image:radial-gradient(rgba(90,70,30,.08) 1px,transparent 1px);background-size:5px 5px}
.editor{font-size:11px;font-style:italic;color:var(--soft);letter-spacing:.04em}
.mast{text-align:center;border-bottom:4px double var(--rule);padding:4px 0 8px}
.mast h1{font-family:'UnifrakturCook','Playfair Display',Georgia,serif;font-size:clamp(40px,9vw,84px);margin:0;line-height:1.05;font-weight:700}
.dateline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--rule);font-family:'Playfair Display',serif;font-size:13px;text-transform:uppercase;letter-spacing:.12em;padding:5px 0}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px 0;border-bottom:1px solid var(--rule)}
button,select,input,textarea{font:inherit}
.btn{background:transparent;border:1.5px solid var(--ink);color:var(--ink);padding:3px 12px;font-family:'Playfair Display',serif;font-size:12px;text-transform:uppercase;letter-spacing:.1em;cursor:pointer}
.btn:hover,.btn.on{background:var(--ink);color:var(--paper)}
.btn.sm{font-size:10px;padding:1px 8px}
.une{border-bottom:3px double var(--rule);padding:18px 0}
.une h2{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(30px,6vw,54px);line-height:1.08;margin:6px 0 10px;text-align:center}
.tag{font-family:'Playfair Display',serif;text-transform:uppercase;letter-spacing:.2em;font-size:11px;text-align:center;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0}
.art{padding:16px 18px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule)}
.art h3{font-family:'Playfair Display',serif;font-weight:700;font-size:24px;line-height:1.15;margin:0 0 8px}
.art img,.une img{display:block;max-width:100%;margin:8px auto;filter:sepia(.55) contrast(1.05);border:1px solid var(--rule)}
.body p{margin:0 0 .7em;text-align:justify;hyphens:auto}
.une .body{column-width:300px;column-gap:28px}
.pub{font-size:11px;color:var(--soft);font-style:italic;margin-top:6px}
.adm{margin-top:6px;display:flex;gap:6px}
.calm{text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(22px,4vw,34px);padding:80px 10px}
.sec{font-family:'Playfair Display',serif;font-size:26px;text-transform:uppercase;letter-spacing:.15em;text-align:center;margin:16px 0 0}
.note{text-align:center;font-style:italic;color:var(--soft);font-size:14px}
.pager{display:flex;justify-content:center;gap:6px;margin:16px 0}
form.ed{border:2px solid var(--ink);background:var(--card);padding:14px;margin:16px 0;display:grid;gap:8px}
form.ed input,form.ed textarea,form.ed select{width:100%;background:#fffaf0;color:#1d1a14;border:1px solid var(--ink);padding:6px;font-size:16px}
form.ed textarea{min-height:140px}
footer{margin-top:28px;border-top:4px double var(--rule);padding-top:8px;text-align:center;font-size:11px;color:var(--soft)}
.writer{background:none;border:0;color:var(--soft);opacity:.45;font-size:10px;cursor:pointer;text-decoration:underline;margin-top:6px}
.writer:hover{opacity:1}
.stack .fact{padding:22px 0;border-bottom:4px double var(--rule);overflow:hidden}.stack .fact:first-child{padding-top:10px}.stack h3{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(24px,4vw,34px);line-height:1.12;margin:0 0 8px}.stack .fact img{float:right;max-width:40%;margin:4px 0 8px 18px}.stack .no{font-family:'Playfair Display',serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);border-bottom:1px solid var(--rule);margin-bottom:8px;display:inline-block}.login{display:flex;gap:6px;justify-content:center;margin:8px 0}.login input{background:#fffaf0;color:#1d1a14;border:1px solid var(--ink);padding:3px 8px;font-size:16px}.bad{color:#8b1a1a;font-size:12px}
.list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0}
.cbox{border:2px solid var(--ink);background:var(--card);padding:12px 16px;margin:14px 0}.cbox h3{font-family:'Playfair Display',serif;margin:0 0 6px}.code{font-family:monospace;font-size:34px;letter-spacing:.2em;margin:10px 0;font-weight:700}.code small{font-size:13px;letter-spacing:0;font-weight:400;color:var(--soft)}.scroll{overflow-x:auto}table.t{width:100%;border-collapse:collapse}table.t td,table.t th{border-bottom:1px solid var(--rule);padding:5px 6px;text-align:left;vertical-align:middle}.cbox input,.cbox select{background:#fffaf0;color:#1d1a14;border:1px solid var(--ink);padding:3px 6px;font-size:15px;max-width:100%}.me{font-size:12px;margin-bottom:6px}.err{color:#8b1a1a;font-size:13px}
.btn.dis{opacity:.4;cursor:not-allowed}.best{border:2px solid var(--ink);background:var(--card);text-align:center;padding:8px 12px;margin:22px auto 0;max-width:420px;font-family:'Playfair Display',serif}.best b{font-size:20px}.rep{background:none;border:0;color:var(--soft);opacity:.5;font-size:10px;cursor:pointer;text-decoration:underline;padding:0}.rep:hover{opacity:1}.mod{margin-top:6px;font-size:12px;border-top:1px dashed var(--rule);padding-top:4px}.mod .btn{margin:2px 2px 0 0}.idl{color:var(--ink);font-family:monospace}.flag{color:#e8710a;font-weight:700}a.flag{text-decoration:underline}.blk td{color:#8b1a1a}.blk .idl{color:#8b1a1a}.small{font-size:11px;color:var(--soft);font-style:italic}.hl{outline:3px solid #e8710a;outline-offset:4px}.inbox{border:2px solid var(--ink);background:var(--card);padding:8px 12px;margin:10px 0;font-size:15px}.inbox b{font-family:'Playfair Display',serif}.bar{height:16px;border:1.5px solid var(--ink);background:#fffaf0;margin:6px 0}.bar div{height:100%;background:#8a7a58}.myid{font-family:monospace}textarea.m{width:100%;min-height:70px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body><div class="sheet" id="app"></div>
<script>
/* ===== PASTE YOUR SUPABASE ANON KEY HERE (see README.md) ===== */
const SUPABASE_URL="https://mqzrkalpknzxjzqdkobp.supabase.co",SUPABASE_KEY="PASTE_ANON_KEY";
const PER=4,KEEP=7;
let best=null,sb=null,me=null,vis=null,panel="",msg="",pendingDel=null,byDay={},meta={},inbox=[],seen=new Set(),reported=new Set(),hl=null,hlScroll=false,polled=false,view="front",page=0,day=todayKey(),form=null,ctl=null,configured=!/PASTE/.test(SUPABASE_KEY);
const isAdmin=()=>!!me&&me.role==="admin";
const isStaff=()=>!!me&&me.role!=="subscriber";
const canEdit=a=>isStaff()&&(isAdmin()||a.account_id===me.id);
const tok=()=>me?me.token:null;
const vArgs=()=>({p_vid:vis?vis.id:null,p_secret:vis?vis.secret:null});
async function rpc(fn,args){const r=await sb.rpc(fn,args||{});if(r.error)throw r.error;return r.data}
function keyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayKey(){return keyOf(new Date())}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return keyOf(d)}
function fmtDay(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}
function fmtTs(t){return new Date(t).toLocaleString("en-US",{month:"long",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function fmtB(b){b=+b||0;return b>=1048576?(b/1048576).toFixed(1)+" MB":b>=1024?(b/1024).toFixed(1)+" KB":b+" B"}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const paras=s=>String(s||"").split(/\n+/).filter(Boolean).map(p=>"<p>"+esc(p)+"</p>").join("");
const dayDocs=k=>byDay[k]||[];
const findDoc=id=>Object.values(byDay).flat().find(a=>a.id===id);
const val=id=>{const e=document.getElementById(id);return e?e.value:""};
const future=t=>t&&Date.parse(t)>Date.now();
const fmtDT=t=>new Date(t).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});

function issue(k){
  const all=dayDocs(k).slice().sort((a,b)=>b.ts-a.ts);
  const adm=all.filter(a=>a.admin),misc=all.filter(a=>a.type==="misc");
  let une=adm.find(a=>a.type==="une")||adm.find(a=>a.type==="news");
  if(!une&&misc.length){const len=a=>(a.body||"").length,rank=(x,y)=>len(y)-len(x)||x.ts-y.ts,withImg=misc.filter(a=>a.image);une=(withImg.length?withImg:misc).slice().sort(rank)[0]}
  const news=all.filter(a=>a.type!=="misc"&&a!==une);
  return {all,une,news,misc,fallback:!adm.length};
}
function artHtml(a){
  const m=meta[a.id];let ctrl="";
  if(canEdit(a))ctrl+=`<div class="adm"><button class="btn sm" data-edit="${a.id}">Edit</button><button class="btn sm" data-del="${a.id}">${pendingDel===a.id?"Click again to confirm":"Delete"}</button></div>`;
  if(a.type==="misc"&&!a.admin&&!isAdmin())ctrl+=`<div class="adm"><button class="rep" data-report="${a.id}" ${reported.has(a.id)?"disabled":""}>${reported.has(a.id)?"reported":"report"}</button></div>`;
  if(isAdmin()&&m){const o=+m.open;ctrl+=`<div class="mod">Author ID: <a href="#" class="idl ${o?"flag":""}" data-vid="${esc(m.vid)}">${esc(m.vid)}</a>${o?` · <b class="flag">⚑ reported ×${o}</b><br><button class="btn sm" data-mod="${a.id}|block24">Block 24h</button><button class="btn sm" data-mod="${a.id}|block30">Block 1 month</button><button class="btn sm" data-mod="${a.id}|blockforever">Block forever</button><button class="btn sm" data-mod="${a.id}|ignore">Ignore</button>`:""}</div>`}
  const who=a.author||(a.type==="misc"&&!a.admin?"Anonymous":"The Editors");
  return `<div class="aw${hl===a.id?" hl":""}" id="a-${a.id}">${a.image?`<img src="${a.image}" alt="">`:""}<div class="body">${paras(a.body)}</div><div class="pub">By ${esc(who)} · Published ${fmtTs(a.ts)}</div>${ctrl}</div>`;
}
function formHtml(){
  const edit=form.id?findDoc(form.id):null;
  const opts=isStaff()?`<select id="f-type"><option value="news">Article</option><option value="une">Front Page (The Lead)</option><option value="misc">Miscellany</option></select>`:"";
  const author=me?"":`<input id="f-author" placeholder="Your name (optional)" maxlength="40">`;
  return `<form class="ed" id="ed"><b style="font-family:'Playfair Display'">${edit?"Edit article":isStaff()?"Write an article":"Write a Miscellany item"}</b>${opts}
  <input id="f-title" placeholder="Title" required maxlength="150" value="${esc(edit?.title||"")}">${author}
  <textarea id="f-body" placeholder="Article…" required maxlength="12000">${esc(edit?.body||"")}</textarea>
  ${(isStaff()||(me&&me.subscribed))?`<div><label class="btn sm" style="display:inline-block">Import an image<input id="f-img" type="file" accept="image/*" hidden></label> <span id="f-imgs" class="note">${edit?.image?"Image attached":""}</span></div>`:`<div><span class="btn sm dis" aria-disabled="true">Import an image</span> <span class="note">You must subscribe to upload images.</span></div>`}
  ${me?`<div class="note">Published under your name: ${esc(me.name)}</div>`:""}
  <div><button class="btn" type="submit">Publish</button> <button class="btn" type="button" id="f-cancel">Cancel</button></div>
  ${isStaff()&&!edit?`<label class="note" style="display:block;text-align:left"><input type="checkbox" id="f-notify" style="width:auto"> Notify subscribers <span class="small">(always on for the Front Page)</span></label>`:""}</form>`;
}
function panelHtml(){
  const bad=msg?`<div class="err">${esc(msg)}</div>`:"";
  const st='style="max-width:420px;margin:16px auto"',tt="font-family:'Playfair Display'";
  if(panel==="login")return `<form class="ed" id="lgf" ${st}><b style="${tt}">Log in</b><input id="l-n" placeholder="Name" autocomplete="username" required><input id="l-p" type="password" placeholder="Password" autocomplete="current-password" required>${bad}<div><button class="btn" type="submit">Log in</button> <button class="btn" type="button" data-panel="activate">Activate your account</button> <button class="btn" type="button" data-panel="">Cancel</button></div></form>`;
  if(panel==="activate")return `<form class="ed" id="acf" ${st}><b style="${tt}">Activate your account</b><input id="a-c" placeholder="One-time code" autocomplete="off" required><input id="a-n" placeholder="Choose your name (shown as author)" maxlength="30" autocomplete="username" required><input id="a-p" type="password" placeholder="Choose a password (8+ characters)" autocomplete="new-password" required><input id="a-p2" type="password" placeholder="Repeat the password" autocomplete="new-password" required>${bad}<div><button class="btn" type="submit">Activate</button> <button class="btn" type="button" data-panel="login">Back to log in</button></div></form>`;
  if(panel==="subscribe")return `<form class="ed" id="sbf" ${st}><b style="${tt}">Subscribe to the Journal</b><div class="note">Get a notification for every official article. Choose a name and a password for your subscriber account.</div><input id="s-n" placeholder="Choose your name" maxlength="30" autocomplete="username" required><input id="s-p" type="password" placeholder="Choose a password (8+ characters)" autocomplete="new-password" required><input id="s-p2" type="password" placeholder="Repeat the password" autocomplete="new-password" required>${bad}<div><button class="btn" type="submit">Subscribe</button> <button class="btn" type="button" data-panel="login">I already have an account</button> <button class="btn" type="button" data-panel="">Cancel</button></div></form>`;
  return "";
}
function inboxHtml(){
  return inbox.map(m=>`<div class="inbox"><b>${m.kind==="news"?"New article":"Message from the editors"}</b><div>${esc(m.body)}</div><div style="margin-top:4px">${m.kind==="news"?`<button class="btn sm" data-ib-read="${m.id}">Read</button> `:""}<button class="btn sm" data-ib-ok="${m.id}">${m.kind==="news"?"Dismiss":"Got it"}</button></div></div>`).join("");
}
function accRow(a){
  const you=me&&a.id===me.id;
  if(ctl.editing===a.id)return `<tr><td><input id="e-n" value="${esc(a.name)}" maxlength="30" size="14"></td><td><select id="e-r"><option value="writer" ${a.role==="writer"?"selected":""}>Writer</option><option value="admin" ${a.role==="admin"?"selected":""}>Admin</option><option value="subscriber" ${a.role==="subscriber"?"selected":""}>Subscriber</option></select></td><td><input id="e-p" type="password" placeholder="New password (optional)" autocomplete="new-password" size="18"></td><td><button class="btn sm" data-acc-save="${a.id}">Save</button> <button class="btn sm" data-acc-edit="">Cancel</button></td></tr>`;
  if(a.protected&&!you)return `<tr><td><b>${esc(a.name)}</b></td><td>Admin</td><td>••••••••</td><td><span class="small">Protected account</span></td></tr>`;
  return `<tr><td><b>${esc(a.name)}</b>${you?" (you)":""}</td><td>${a.role==="admin"?"Admin":a.role==="writer"?"Writer":"Subscriber"}</td><td>••••••••</td><td><button class="btn sm" data-acc-edit="${a.id}">Edit</button> ${you?"":`<button class="btn sm" data-msg-acc="${a.id}|${esc(a.name)}">Message</button> <button class="btn sm" data-acc-del="${a.id}">${ctl.pendingDel===a.id?"Click again to confirm":"Delete"}</button>`}</td></tr>`;
}
function ctlHtml(){
  if(!ctl||!ctl.accounts)return `<div class="calm" style="padding:40px 10px;font-size:22px">${ctl&&ctl.err?esc(ctl.err):"Loading…"}</div>`;
  const staff=ctl.accounts.filter(a=>a.role!=="subscriber"),subs=ctl.accounts.filter(a=>a.role==="subscriber");
  const th="<tr><th>Name</th><th>Role</th><th>Password</th><th></th></tr>";
  const st=ctl.stats||{days:[]},sg=ctl.storage;
  let h=`<h2 class="sec">Control Room</h2>${ctl.err?`<div class="err" style="text-align:center">${esc(ctl.err)}</div>`:""}
  <section class="cbox"><h3>One-time activation code</h3><p class="note" style="text-align:left;margin:0 0 8px">Valid for 10 minutes, usable once. Choose the role of the future account.</p><select id="c-role"><option value="writer">Writer</option><option value="admin">Admin</option></select> <button class="btn sm" id="c-gen">Generate a code</button>${ctl.code?`<div class="code">${esc(ctl.code.code)} <small id="c-left"></small></div>`:""}</section>`;
  if(ctl.msgTo)h+=`<section class="cbox"><h3>Message to ${esc(ctl.msgTo.label)}</h3><textarea class="m" id="m-body" maxlength="1000" placeholder="They will read it the next time they come to the Journal."></textarea><div style="margin-top:6px"><button class="btn sm" id="m-send">Send</button> <button class="btn sm" id="m-cancel">Cancel</button></div></section>`;
  h+=`<section class="cbox"><h3>Admins &amp; writers (${staff.length})</h3><div class="scroll"><table class="t">${th}${staff.map(accRow).join("")}</table></div></section>
  <section class="cbox"><h3>Subscribers (${subs.length})</h3><div class="scroll"><table class="t">${th}${subs.map(accRow).join("")||`<tr><td colspan="4">No subscribers yet.</td></tr>`}</table></div></section>
  <section class="cbox"><h3>Visits</h3><p style="margin:0 0 6px">Total: <b>${st.total??0}</b> · Today: <b>${st.today??0}</b></p><div class="scroll"><table class="t"><tr><th>Day</th><th>Visits</th></tr>${(st.days||[]).map(d=>`<tr><td>${esc(d.day)}</td><td>${d.n}</td></tr>`).join("")||`<tr><td colspan="2">No visits recorded yet.</td></tr>`}</table></div></section>`;
  if(sg){const pct=Math.min(100,sg.db_bytes/sg.limit_bytes*100);h+=`<section class="cbox"><h3>Storage</h3><div class="bar"><div style="width:${pct.toFixed(1)}%"></div></div><p style="margin:0">Used <b>${fmtB(sg.db_bytes)}</b> of ${fmtB(sg.limit_bytes)} (${pct.toFixed(1)}%) · <b>${fmtB(Math.max(0,sg.limit_bytes-sg.db_bytes))}</b> left</p><p class="small" style="margin:4px 0 0">Articles: ${sg.articles} · text ${fmtB(sg.text_bytes)} · images ${fmtB(sg.image_bytes)} · the rest is the database itself. Limit of the free plan (500 MB).</p></section>`}
  const vs=ctl.visitors||[];
  h+=`<section class="cbox"><h3>Visitor IDs (${vs.length})</h3><div class="scroll"><table class="t"><tr><th>ID</th><th>Posts</th><th>Reports</th><th>Status</th><th></th></tr>${vs.map(v=>{
    const blocked=v.blocked_forever||future(v.blocked_until);
    const status=v.blocked_forever?"Blocked forever":future(v.blocked_until)?"Blocked until "+fmtDT(v.blocked_until):future(v.report_ban_until)?"Cannot report until "+fmtDT(v.report_ban_until):"–";
    const act=blocked?`<button class="btn sm" data-blk="${v.id}|unblock">Unblock</button>`:`<button class="btn sm" data-blk="${v.id}|block24">24h</button><button class="btn sm" data-blk="${v.id}|block30">1 month</button><button class="btn sm" data-blk="${v.id}|blockforever">Forever</button>`;
    return `<tr class="${blocked?"blk":""}"><td><a href="#" class="idl ${+v.open_reports?"flag":""}" data-vid="${esc(v.id)}">${esc(v.id)}</a>${v.last_name?`<div class="small">${esc(v.last_name)}</div>`:""}</td><td>${v.posts}</td><td>${+v.open_reports?`<b class="flag">⚑ ${v.open_reports}</b>`:"–"}</td><td>${status}</td><td>${act} <button class="btn sm" data-msg-vis="${esc(v.id)}">Message</button></td></tr>`}).join("")||`<tr><td colspan="5">No visitors yet.</td></tr>`}</table></div></section>`;
  return h;
}
function render(){
  const today=todayKey(),isToday=day===today,ready=byDay[day]!==undefined,I=issue(day);
  const pastDays=Array.from({length:KEEP},(_,i)=>daysAgo(i+1));
  let h=`<div class="editor">Editor-in-chief: IMortalisk</div>
  <header class="mast"><h1>The Luisville Journal</h1></header>
  <div class="dateline"><span>${fmtDay(day)}${isToday?"":" — archive"}</span><span>Delivery Not Guaranteed · Price: one cent</span></div>
  <nav><button class="btn ${view==="front"?"on":""}" data-v="front">Front Page</button><button class="btn ${view==="misc"?"on":""}" data-v="misc">Miscellany</button><button class="btn ${view==="past"?"on":""}" data-v="past">Past Issues</button>${isAdmin()?`<button class="btn ${view==="control"?"on":""}" data-v="control">Control</button>`:""}${me&&me.subscribed?"":`<button class="btn" data-sub>Subscribe</button>`}${isToday?"":`<button class="btn" data-today>Today's Issue</button>`}</nav>`;
  if(!configured)h+=`<div class="calm" style="font-size:20px">Setup needed: paste your Supabase key at the top of index.html (see README).</div>`;
  else{
    h+=panelHtml()+inboxHtml();
    if(view==="control"&&isAdmin())h+=ctlHtml();
    else{
      if(form)h+=formHtml();
      else if(isToday&&view!=="past"&&!panel)h+=`<div class="pager"><button class="btn sm" data-new>${isStaff()?"+ Write an article":"+ Write a Miscellany item"}</button></div>`;
      if(view==="past"){
        h+=`<h2 class="sec">Past Issues</h2><p class="note">Issues are kept for ${KEEP} days.</p><div class="list">${pastDays.map(d=>`<button class="btn" data-day="${d}">${fmtDay(d)}</button>`).join("")}</div>`;
      }else if(!ready)h+=`<div class="calm">Setting the type…</div>`;
      else if(view==="misc"){
        h+=`<h2 class="sec">Miscellany</h2><p class="note">Anyone may contribute — rumours, sightings and tidbits from Luisville.</p>`;
        h+=I.misc.length?`<div class="grid">${I.misc.map(a=>`<div class="art"><h3>${esc(a.title)}</h3>${artHtml(a)}</div>`).join("")}</div>`:`<div class="calm">Nothing here yet. Be the first to write!</div>`;
      }else if(!I.all.length){
        h+=`<div class="calm">Luisville is calm and its inhabitants with it…</div>`;
      }else{
        if(I.fallback)h+=`<p class="note" style="margin-top:12px">The editors have not yet filed this edition — here is the Miscellany.</p>`;
        if(I.une)h+=`<section class="une"><div class="tag">${I.fallback?"From the Miscellany":"Front Page"}</div><h2>${esc(I.une.title)}</h2>${artHtml(I.une)}</section>`;
        const list=I.fallback?I.misc.filter(a=>a!==I.une):I.news;
        const pages=Math.max(1,Math.ceil(list.length/PER));if(page>=pages)page=pages-1;
        const cur=list.slice(page*PER,page*PER+PER);
        if(cur.length)h+=I.fallback?`<div class="grid">${cur.map(a=>`<div class="art"><h3>${esc(a.title)}</h3>${artHtml(a)}</div>`).join("")}</div>`:`<div class="stack">${cur.map((a,i)=>`<article class="fact"><div class="no">Report No. ${page*PER+i+1}</div><h3>${esc(a.title)}</h3>${artHtml(a)}</article>`).join("")}</div>`;
        if(pages>1)h+=`<div class="pager">${Array.from({length:pages},(_,i)=>`<button class="btn sm ${i===page?"on":""}" data-p="${i}">Page ${i+1}</button>`).join("")}</div>`;
        if(!I.fallback&&I.misc.length)h+=`<div class="pager"><button class="btn" data-v="misc">Read the Miscellany (${I.misc.length})</button></div>`;
      }
    }
  }
  if(configured&&best&&view==="front")h+=`<div class="best">★ Best Editor ★<br><b>${esc(best.name)}</b><div class="small">${Number(best.words).toLocaleString("en-US")} words sent</div></div>`;
  h+=`<footer>The Luisville Journal · Printed daily · All rights reserved<br>${me?`<div class="me">Signed in as <b>${esc(me.name)}</b> (${me.role}) ${me.subscribed?`<button class="writer" style="opacity:.8" data-unsub>unsubscribe</button> `:""}<button class="writer" style="opacity:.8" data-logout>log out</button></div>`:`<button class="writer" data-panel="login">log in</button>`}${vis?`<div class="small">Your ID: <span class="myid">${esc(vis.id)}</span></div>`:configured?`<div class="small">ID unavailable (run setup.sql in Supabase, then reload)</div>`:""}</footer>`;
  const y=scrollY;document.getElementById("app").innerHTML=h;scrollTo(0,y);bind();
  if(hlScroll){const el=document.getElementById("a-"+hl);if(el){hlScroll=false;el.scrollIntoView({block:"center"})}}
}
async function loadDay(k){
  try{const r=await sb.from("articles").select("*").eq("day",k);if(r.error)throw r.error;byDay[k]=r.data}catch(e){byDay[k]=byDay[k]||[]}
  if(isAdmin()){try{(await rpc("admin_day_meta",{p_tok:tok(),p_day:k})).forEach(x=>meta[x.id]=x)}catch(e){}}
  render();
}
async function loadCtl(keep){
  const old=keep?ctl:{};ctl={...old};
  const get=async(k,fn)=>{try{ctl[k]=await rpc(fn,{p_tok:tok()})}catch(e){ctl.err=e.message}};
  await Promise.all([get("accounts","list_accounts"),get("stats","visit_stats"),get("visitors","list_visitors"),get("storage","storage_stats")]);
  render();
}
function setMe(r){me={id:r.id,name:r.name,role:r.role,subscribed:!!r.subscribed,token:r.token};try{localStorage.setItem("dng_tok",r.token)}catch(e){}panel="";msg="";loadDay(day);pollInbox()}
function askNotif(){try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}}
async function pollInbox(){
  if(!sb||(!me&&!vis))return;
  try{const r=await rpc("my_messages",{p_tok:tok(),...vArgs()});inbox=r||[];
    inbox.forEach(m=>{if(!seen.has(m.id)){seen.add(m.id);if(polled&&"Notification" in window&&Notification.permission==="granted"){try{new Notification(m.kind==="news"?"New article – The Luisville Journal":"Message – The Luisville Journal",{body:m.body})}catch(e){}}}});
    polled=true;if(!form&&!panel&&view!=="control")render()}catch(e){}
}
async function markRead(ids){inbox=inbox.filter(m=>!ids.includes(m.id));try{await rpc("mark_read",{p_tok:tok(),...vArgs(),p_ids:ids})}catch(e){}}
function goArticle(id,d,v){day=d;view=v;page=0;hl=id;hlScroll=true;form=null;panel="";ctl=null;render();loadDay(d)}
function bind(){
  const $=s=>document.querySelectorAll(s);
  $("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;page=0;form=null;panel="";hl=null;if(view==="control"){ctl={};render();loadCtl()}else render()});
  $("[data-p]").forEach(b=>b.onclick=()=>{page=+b.dataset.p;render()});
  $("[data-day]").forEach(b=>b.onclick=()=>{day=b.dataset.day;view="front";page=0;render();scrollTo(0,0);loadDay(day)});
  $("[data-today]").forEach(b=>b.onclick=()=>{day=todayKey();view="front";render()});
  $("[data-new]").forEach(b=>b.onclick=()=>{form={};render();scrollTo(0,0)});
  $("[data-edit]").forEach(b=>b.onclick=()=>{form={id:b.dataset.edit};render();scrollTo(0,0)});
  $("[data-del]").forEach(b=>b.onclick=async()=>{if(pendingDel!==b.dataset.del){pendingDel=b.dataset.del;render();return}pendingDel=null;try{await rpc("delete_article",{p_tok:tok(),p_id:b.dataset.del});loadDay(day)}catch(e){alert(e.message);render()}});
  $("[data-panel]").forEach(b=>b.onclick=()=>{panel=b.dataset.panel;msg="";form=null;render();scrollTo(0,0)});
  $("[data-logout]").forEach(b=>b.onclick=async()=>{try{await rpc("logout",{p_tok:tok()})}catch(e){}me=null;form=null;ctl=null;meta={};inbox=[];if(view==="control")view="front";try{localStorage.removeItem("dng_tok")}catch(e){}render()});
  $("[data-sub]").forEach(b=>b.onclick=async()=>{askNotif();if(me){try{await rpc("set_subscription",{p_tok:tok(),p_on:true});me.subscribed=true}catch(e){alert(e.message)}render()}else{panel="subscribe";msg="";render();scrollTo(0,0)}});
  $("[data-unsub]").forEach(b=>b.onclick=async()=>{try{await rpc("set_subscription",{p_tok:tok(),p_on:false});me.subscribed=false}catch(e){alert(e.message)}render()});
  /* forms: log in / activate / subscribe */
  const lg=document.getElementById("lgf");
  if(lg)lg.onsubmit=async e=>{e.preventDefault();try{const r=await rpc("login",{p_name:val("l-n"),p_pass:val("l-p")});if(r.error){msg=r.error;render()}else setMe(r)}catch(err){msg="Could not reach the server.";render()}};
  const ac=document.getElementById("acf");
  if(ac)ac.onsubmit=async e=>{e.preventDefault();if(val("a-p")!==val("a-p2")){msg="The two passwords do not match.";render();return}
    try{const r=await rpc("activate",{p_code:val("a-c"),p_name:val("a-n"),p_pass:val("a-p")});if(r.error){msg=r.error;render()}else setMe(r)}catch(err){msg="Could not reach the server.";render()}};
  const sf=document.getElementById("sbf");
  if(sf)sf.onsubmit=async e=>{e.preventDefault();if(val("s-p")!==val("s-p2")){msg="The two passwords do not match.";render();return}
    try{const r=await rpc("subscribe_signup",{p_name:val("s-n"),p_pass:val("s-p")});if(r.error){msg=r.error;render()}else{askNotif();setMe(r)}}catch(err){msg="Could not reach the server.";render()}};
  /* inbox */
  $("[data-ib-ok]").forEach(b=>b.onclick=()=>{markRead([b.dataset.ibOk]);render()});
  $("[data-ib-read]").forEach(b=>b.onclick=()=>{const m=inbox.find(x=>x.id===b.dataset.ibRead);if(!m)return;markRead([m.id]);goArticle(m.article_id,m.day,"front")});
  /* report + moderation */
  $("[data-report]").forEach(b=>b.onclick=async()=>{try{await rpc("report_article",{...vArgs(),p_article:b.dataset.report});reported.add(b.dataset.report);alert("Thank you. The editors have been notified.")}catch(e){alert(e.message)}render()});
  $("[data-mod]").forEach(b=>b.onclick=async()=>{const [id,act]=b.dataset.mod.split("|");try{await rpc("moderate",{p_tok:tok(),p_article:id,p_action:act})}catch(e){alert(e.message)}loadDay(day)});
  $("[data-vid]").forEach(b=>b.onclick=async e=>{e.preventDefault();try{const r=await rpc("visitor_article",{p_tok:tok(),p_vid:b.dataset.vid});if(!r)alert("No article from this ID (articles are removed after "+KEEP+" days).");else goArticle(r.id,r.day,"misc")}catch(err){alert(err.message)}});
  /* control room */
  const gen=document.getElementById("c-gen");
  if(gen)gen.onclick=async()=>{try{const r=await rpc("gen_code",{p_tok:tok(),p_role:val("c-role")});ctl.code={code:r.code,until:Date.parse(r.expires_at)};ctl.err=""}catch(e){ctl.err=e.message}render()};
  $("[data-acc-edit]").forEach(b=>b.onclick=()=>{ctl.editing=b.dataset.accEdit||null;ctl.err="";render()});
  $("[data-acc-del]").forEach(b=>b.onclick=async()=>{const id=b.dataset.accDel;if(ctl.pendingDel!==id){ctl.pendingDel=id;render();return}ctl.pendingDel=null;try{await rpc("delete_account",{p_tok:tok(),p_id:id});ctl.err=""}catch(e){ctl.err=e.message}loadCtl(true)});
  $("[data-acc-save]").forEach(b=>b.onclick=async()=>{try{await rpc("update_account",{p_tok:tok(),p_id:b.dataset.accSave,p_name:val("e-n"),p_pass:val("e-p"),p_role:val("e-r")});ctl.editing=null;ctl.err=""}catch(e){ctl.err=e.message}loadCtl(true)});
  $("[data-blk]").forEach(b=>b.onclick=async()=>{const [id,mode]=b.dataset.blk.split("|");try{await rpc("block_visitor",{p_tok:tok(),p_vid:id,p_mode:mode});ctl.err=""}catch(e){ctl.err=e.message}loadCtl(true)});
  $("[data-msg-acc]").forEach(b=>b.onclick=()=>{const [id,name]=b.dataset.msgAcc.split("|");ctl.msgTo={account:id,label:name};render();scrollTo(0,0)});
  $("[data-msg-vis]").forEach(b=>b.onclick=()=>{ctl.msgTo={visitor:b.dataset.msgVis,label:"ID "+b.dataset.msgVis};render();scrollTo(0,0)});
  const mc=document.getElementById("m-cancel");if(mc)mc.onclick=()=>{ctl.msgTo=null;render()};
  const ms=document.getElementById("m-send");
  if(ms)ms.onclick=async()=>{try{await rpc("send_message",{p_tok:tok(),p_to_account:ctl.msgTo.account||null,p_to_visitor:ctl.msgTo.visitor||null,p_body:val("m-body")});ctl.msgTo=null;ctl.err="";alert("Message sent. It will be shown the next time they visit.")}catch(e){ctl.err=e.message}render()};
  /* article form */
  const ed=document.getElementById("ed");if(!ed)return;
  let img=null;const old=form.id?findDoc(form.id):null;
  const t=document.getElementById("f-type");if(t)t.value=old?old.type:"news";
  document.getElementById("f-cancel").onclick=()=>{form=null;render()};
  const nt=document.getElementById("f-notify");
  if(t){const sync=()=>{if(!nt)return;if(t.value==="une"){nt.checked=true;nt.disabled=true}else nt.disabled=false};t.onchange=sync;sync()}
  const fi=document.getElementById("f-img");
  if(fi)fi.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,700/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);img=c.toDataURL("image/jpeg",.7);document.getElementById("f-imgs").textContent="Image ready ✓"};im.src=r.result};r.readAsDataURL(f)};
  ed.onsubmit=async e=>{e.preventDefault();
    const title=val("f-title").trim(),body=val("f-body").trim();
    try{
      if(old)await rpc("edit_article",{p_tok:tok(),p_id:old.id,p_title:title,p_body:body,p_type:val("f-type")||old.type,p_image:img});
      else if(isStaff()){await rpc("post_article",{p_tok:tok(),p_title:title,p_body:body,p_type:val("f-type"),p_image:img||"",p_day:todayKey(),p_notify:!!(nt&&nt.checked)});view="front"}
      else{await rpc("post_misc",{...vArgs(),p_tok:tok(),p_title:title,p_body:body,p_image:img||"",p_author:val("f-author").trim(),p_day:todayKey()});view="front"}
      form=null;loadBest();await loadDay(old?old.day:todayKey());
    }catch(err){if(/log in/i.test(err.message||"")){me=null;try{localStorage.removeItem("dng_tok")}catch(x){}}alert("Could not publish: "+((err&&(err.message||err.details))||err));render()}
  };
}
async function loadBest(){try{best=await rpc("best_editor")}catch(e){}}
async function purge(){try{await sb.from("articles").delete().lt("day",daysAgo(KEEP))}catch(e){}}
render();
if(configured){
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  (async()=>{
    try{vis=JSON.parse(localStorage.getItem("dng_vis")||"null")}catch(e){}
    if(!vis||!vis.id){try{vis=await rpc("new_visitor");localStorage.setItem("dng_vis",JSON.stringify(vis))}catch(e){}}
    try{if(!sessionStorage.getItem("dng_v")){sessionStorage.setItem("dng_v","1");await sb.rpc("log_visit",vArgs())}}catch(e){}
    try{const t=localStorage.getItem("dng_tok");if(t){const r=await rpc("me",{p_tok:t});if(r){me={id:r.id,name:r.name,role:r.role,subscribed:!!r.subscribed,token:t}}else localStorage.removeItem("dng_tok")}}catch(e){}
    render();if(isAdmin())loadDay(day);pollInbox();
  })();
  const tick=()=>{if(!form&&!panel&&view!=="control")loadDay(todayKey());pollInbox();loadBest()};tick();setInterval(tick,30000);
  purge();
  setInterval(()=>{const el=document.getElementById("c-left");if(el&&ctl&&ctl.code){const s=Math.round((ctl.code.until-Date.now())/1000);el.textContent=s>0?"· expires in "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):"· expired"}},1000);
  setInterval(()=>{if(day!==todayKey()&&day===lastDay&&!form&&!hl)location.reload();lastDay=day},60000);
}
let lastDay=day;
</script></body></html>
