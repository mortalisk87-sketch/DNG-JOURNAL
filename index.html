async function loadFires(){if(!configured)return;try{const r=await rpc("fire_counts",{p_vid:vis?vis.id:""});const nf=r.counts||{},nm=new Set(r.mine||[]);if(JSON.stringify(nf)!==JSON.stringify(fires)||[...nm].join()!==[...myFires].join()){fires=nf;myFires=nm;if(!form&&!panel&&view!=="control"&&view!=="profile")render()}}catch(e){}}

    try{const g=await sb.auth.getSession();if(g.data&&g.data.session)await loadMe()}catch(e){}
    booted=true;
    render();if(isAdmin())loadDay(day);pollInbox();
